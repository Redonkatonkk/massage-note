name: 持续集成

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_nas_image:
        description: 构建 NAS 候选镜像并计时（分支运行不发布正式标签）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://massage:massage@localhost:5432/massage_note
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: massage_note
          POSTGRES_USER: massage
          POSTGRES_PASSWORD: massage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U massage -d massage_note"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 检查版本、文档链接并准备共享包
        run: pnpm version:check && pnpm docs:check && pnpm ui:check && pnpm ui:mobile && pnpm predev
      - name: 类型检查
        run: pnpm -r typecheck
      - name: 工具与单元测试（API 在集成测试阶段一并运行）
        run: pnpm test:tooling && pnpm --filter @massage-note/domain --filter @massage-note/contracts --filter @massage-note/messages-agent --filter @massage-note/web test
      - name: 运行临时 CI 数据库集成测试
        run: |
          pnpm --filter @massage-note/database migrate:deploy
          pnpm --filter @massage-note/database test
          pnpm --filter @massage-note/api test
        env:
          DATABASE_INTEGRATION_TESTS: "1"
      - name: 生产构建（发布运行由并行镜像构建覆盖）
        if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !inputs.build_nas_image)
        run: pnpm build

  build-nas-image:
    name: 并行构建 NAS 候选镜像
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.build_nas_image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.image.outputs.name }}
      version: ${{ steps.image.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本与规范化镜像名
        id: image
        shell: bash
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "cache=main" >> "$GITHUB_OUTPUT"
          else
            echo "cache=benchmark" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 linux/amd64 候选镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: nas
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:ci-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ steps.image.outputs.cache }}
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache-main
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ steps.image.outputs.cache }},mode=max
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            API_PROXY_TARGET=http://127.0.0.1:4000
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

  publish-nas-image:
    name: 验证通过后发布正式镜像标签
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, build-nas-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-nas-image-main
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 将已验证 digest 标记为正式版本
        shell: bash
        env:
          IMAGE: ${{ needs.build-nas-image.outputs.name }}
          VERSION: ${{ needs.build-nas-image.outputs.version }}
          DIGEST: ${{ needs.build-nas-image.outputs.digest }}
        run: |
          set -euo pipefail
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          if existing=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}' 2>"$error_file"); then
            if [[ "$existing" != "$DIGEST" ]]; then
              echo "正式版本 $VERSION 已存在且 digest 不同；请递增版本。" >&2
              exit 1
            fi
          elif ! grep -Fq "$IMAGE:$VERSION: not found" "$error_file" \
            && ! grep -Fq 'manifest unknown' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-${GITHUB_SHA:0:7}" "$IMAGE@$DIGEST"

  report-timing:
    name: 记录流水线各阶段耗时
    if: always()
    needs: [verify, build-nas-image, publish-nas-image]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: 写入运行计时摘要
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.completed_at != null) | [.name, .conclusion, (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | tostring)] | @tsv' \
            > "$RUNNER_TEMP/job-timing.tsv"
          {
            echo '| 阶段 | 结果 | 耗时（秒） |'
            echo '| --- | --- | ---: |'
            while IFS=$'\t' read -r name result seconds; do
              printf '| %s | %s | %s |\n' "$name" "$result" "$seconds"
            done < "$RUNNER_TEMP/job-timing.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
