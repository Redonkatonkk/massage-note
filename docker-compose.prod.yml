name: massage-note

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: massage_note
      POSTGRES_USER: massage_note_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      MASSAGE_NOTE_APP_PASSWORD: ${MASSAGE_NOTE_APP_PASSWORD}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massage_note_admin -d massage_note"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  migrate:
    build:
      context: .
      target: migrate
      args: &web-build-args
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  harden:
    image: postgres:17-alpine
    command: ["psql", "--set=ON_ERROR_STOP=1", "--file=/opt/massage-note/harden.sql", "${ADMIN_DATABASE_URL}"]
    volumes:
      - ./docker/postgres/harden.sql:/opt/massage-note/harden.sql:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]

  api:
    build:
      context: .
      target: api
      args: *web-build-args
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN}
      DATABASE_URL: ${APP_DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_COOKIE_NAME: massage_note_session
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      DEV_AUTH_ENABLED: "false"
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_API_BASE_URL: ${MINIMAX_API_BASE_URL:-https://api.minimaxi.com}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GOOGLE_CLOUD_CREDENTIALS_BASE64: ${GOOGLE_CLOUD_CREDENTIALS_BASE64:-}
    depends_on:
      harden: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend, frontend]

  web:
    build:
      context: .
      target: web
      args: *web-build-args
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [frontend]

networks:
  backend: { internal: true }
  frontend: {}

volumes:
  postgres-prod-data: {}
  redis-prod-data: {}
