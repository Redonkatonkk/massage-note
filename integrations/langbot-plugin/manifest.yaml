apiVersion: v1
kind: Plugin
metadata:
  author: walton
  name: massage-note-work-bot
  repository: https://massagenote.waltonjin.com/
  version: 1.2.0
  description:
    en_US: Complete work records and scoped database queries for Massage Note.
    zh_Hans: 支持完整记工、折扣、加项、高亮、混合付款和数据库查询的 Massage Note 插件。
  label:
    en_US: Massage Note Work Bot
    zh_Hans: Massage Note 记工助手
  icon: assets/icon.svg
spec:
  config:
    - name: api_base_url
      type: string
      label:
        en_US: Massage Note API URL
        zh_Hans: Massage Note API 地址
      description:
        en_US: HTTPS origin and API prefix for Massage Note.
        zh_Hans: Massage Note 的 HTTPS 地址及 API 前缀。
      default: https://massagenote.waltonjin.com/api/v1
      required: true
    - name: integration_token
      type: string
      label:
        en_US: Integration token
        zh_Hans: 集成令牌
      description:
        en_US: Required. Set this in the plugin configuration; isolated plugin workers do not inherit the Runtime container environment.
        zh_Hans: 必填。请在插件配置中填写；隔离的插件进程不会继承 Runtime 容器环境变量。
      required: true
    - name: bot
      type: bot-selector
      label:
        en_US: Work bot
        zh_Hans: 记工机器人
      description:
        en_US: Only group messages routed through this dedicated bot are handled.
        zh_Hans: 只接管通过这个专用机器人进入的群消息。
      required: true
    - name: model
      type: llm-model-selector
      label:
        en_US: Parser model
        zh_Hans: 黑话解析模型
      description:
        en_US: Required for every message. The live store alias skill is supplied to this model for semantic understanding.
        zh_Hans: 每条消息都必须使用；当前店铺的实时黑话技能会提供给该模型进行语义理解。
      required: true
  components:
    EventListener:
      fromDirs:
        - path: components/events/
          maxDepth: 1
execution:
  python:
    path: main.py
    attr: MassageNoteWorkBotPlugin
