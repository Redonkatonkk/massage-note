packages:
  - "apps/*"
  - "packages/*"

confirmModulesPurge: false
overrides:
  effect: 3.20.0
  multer: 2.2.0
  postcss: 8.5.25
  sharp: 0.35.0
  uuid: 11.1.1
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "@firebase/util"
  - "protobufjs"
  - "prisma"
  - "sharp"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@firebase/util': true
  protobufjs: true
  prisma: true
  sharp: true
